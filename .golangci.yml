version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - dogsled
    - dupl
    - errcheck
    - errorlint
    - exhaustive
    - gocognit
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - misspell
    - mnd
    - nestif
    - nilerr
    - noctx
    - prealloc
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    depguard:
      rules:
        # The rule replaces depguard's default, which allows only the standard library and
        # so flagged every module this repo already depends on.
        Main:
          allow:
            - $gostd
            - github.com/newrelic/nri-kube-events
            - github.com/newrelic/infra-integrations-sdk
            - github.com/prometheus/client_golang
            - github.com/prometheus/client_model
            - github.com/sethgrid/pester
            - github.com/sirupsen/logrus
            - github.com/stretchr/testify
            - golang.org/x/time/rate
            - gopkg.in/yaml.v3
            - k8s.io/api
            - k8s.io/apimachinery
            - k8s.io/client-go
            - k8s.io/kubectl
    dupl:
      threshold: 100
    gocyclo:
      min-complexity: 20
    govet:
      enable:
        - shadow
        - fieldalignment
    misspell:
      locale: US
    mnd:
      checks:
        - argument
        - case
        - condition
        - return
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/newrelic/nri-kube-events
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
