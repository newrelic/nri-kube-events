{{- if (.Values.objectState).enabled }}
{{- /* The carrier fills this Secret with its redaction key on its first start, by an update,
so it needs no right to create Secrets. The chart renders it without data; Helm's three-way
merge keeps the key across upgrades. */}}
apiVersion: v1
kind: Secret
metadata:
  labels:
    {{- include "newrelic.common.labels" . | nindent 4 }}
  name: nri-kube-events-hmac
  namespace: {{ .Release.Namespace }}
  annotations:
    # Keep the key when the release is uninstalled, so a reinstall reuses it.
    helm.sh/resource-policy: keep
type: Opaque
{{- end }}
