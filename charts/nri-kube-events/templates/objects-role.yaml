{{- if and .Values.rbac.create (.Values.objectState).enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    {{- include "newrelic.common.labels" . | nindent 4 }}
  name: {{ include "newrelic.common.naming.fullname" . }}-objects
  namespace: {{ .Release.Namespace }}
rules:
# The hash store creates its pointer and shard ConfigMaps. Kubernetes RBAC cannot limit
# create by name. The ClusterRole's get, list and watch let it find them by label.
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
# It updates and deletes only its own ConfigMaps: the pointer and every shard name, two
# slots of objects.MaxShards (128) shards each (pkg/objects/store.go).
- apiGroups:
  - ""
  resources:
  - configmaps
  resourceNames:
  - nri-kube-events-hashes-current
  {{- range $slot := list "a" "b" }}
  {{- range $i := until 128 }}
  - nri-kube-events-hashes-{{ $slot }}-{{ $i }}
  {{- end }}
  {{- end }}
  verbs:
  - get
  - update
  - delete
# The HMAC key Secret is created once and read on every start.
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
- apiGroups:
  - ""
  resources:
  - secrets
  resourceNames:
  - nri-kube-events-hmac
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    {{- include "newrelic.common.labels" . | nindent 4 }}
  name: {{ include "newrelic.common.naming.fullname" . }}-objects
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "newrelic.common.naming.fullname" . }}-objects
subjects:
- kind: ServiceAccount
  name: {{ include "newrelic.common.serviceAccount.name" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
